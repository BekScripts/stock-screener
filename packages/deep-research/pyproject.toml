[project]
name = "deep-research"
version = "0.1.0"
description = "The on-demand deep research contract: deterministic evidence, current external evidence, and the report they support."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aziz", email = "azizzbek.io@gmail.com" }]

dependencies = [
    "domain",
    "pydantic>=2.9",
    "research",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deep_research"
module-root = "src"

[tool.uv.sources]
domain = { workspace = true }
research = { workspace = true }
