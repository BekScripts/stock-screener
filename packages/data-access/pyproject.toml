[project]
name = "data-access"
version = "0.1.0"
description = "Persistence and caching for securities data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aziz", email = "azizzbek.io@gmail.com" }]

dependencies = [
    "domain",
    "psycopg[binary]>=3.2",
    "research",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_access"
module-root = "src"

[tool.uv.sources]
domain = { workspace = true }
research = { workspace = true }
