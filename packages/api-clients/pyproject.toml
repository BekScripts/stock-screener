[project]
name = "api-clients"
version = "0.1.0"
description = "Outbound HTTP clients for market data providers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aziz", email = "azizzbek.io@gmail.com" }]

dependencies = [
    "deep-research",
    "anthropic>=0.116",
    "domain",
    "httpx>=0.28",
    "pydantic>=2.9",
    "research",
    "structlog>=24.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api_clients"
module-root = "src"

[tool.uv.sources]
deep-research = { workspace = true }
domain = { workspace = true }
research = { workspace = true }
