site_name: app
site_description: "TODO: one-line description of this project."

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

# Nav follows Diátaxis: tutorials teach, how-to guides solve, reference
# describes, explanation discusses. See the `documentation` skill.
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
  - How-to:
      - how-to/index.md
      - Add a shared package: how-to/add-a-shared-package.md
      - Add a configuration setting: how-to/add-a-setting.md
  - Reference:
      - reference/index.md
      - Configuration: reference/configuration.md
      - Commands: reference/commands.md
  - Explanation:
      - explanation/index.md
      - Architecture: explanation/architecture.md
  - Decisions:
      - adr/index.md
      - 0001 Record architecture decisions: adr/0001-record-architecture-decisions.md
      - 0002 Use uv workspaces: adr/0002-use-uv-workspaces.md
