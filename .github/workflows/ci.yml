name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Narrowest permissions that work. Widen per-job only if a job needs it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_FROZEN: "1"

jobs:
  # Skip the expensive jobs for docs-only changes. Everything else runs the full
  # suite.
  #
  # Splitting further — one matrix entry per package — is worth doing once the
  # workspace has several packages and the suite gets slow. If you do, the
  # filters must encode TRANSITIVE dependencies: a change to a package has to
  # retest everything that imports it, or CI reports green on a break. Add the
  # dependency to the filter in the same commit that adds it to pyproject.toml.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'packages/**'
              - 'tests/**'
              - 'scripts/**'
              # A migration is code: tests/integration/test_migrations.py
              # applies the chain to a clean database and asserts the result
              # still matches the models. Omitting these paths let a schema
              # change merge with that check skipped.
              - 'migrations/**'
              - 'alembic.ini'
              # The mock providers read this, so the integration suite depends
              # on its shape.
              - 'fixtures/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  quality:
    name: lint + types
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-packages --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: make types

  test:
    name: test (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-packages --all-groups

      - name: pytest
        run: make test-ci

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # Single required status check — branch protection points at this one job, so
  # adding a matrix entry never means reconfiguring protection rules.
  ci:
    name: CI
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
