name: AI PR review loop

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Review Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Automated semantic review disabled
        run: |
          echo "Paid automated AI review is disabled."
          echo "Use normal CI plus human/manual ChatGPT review before merge when desired."
